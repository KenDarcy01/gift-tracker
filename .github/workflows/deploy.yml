name: Deploy (database, email function, website)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1. Database changes first, so the new website and function find what they need.
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply new database migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            new=$(ls supabase/migrations | awk -F_ '$1 >= 20261114000000' | wc -l)
            if [ "$new" -gt 0 ]; then
              echo "::error::Add the SUPABASE_DB_URL repository secret so new migrations can be applied."
              exit 1
            fi
            echo "No database secret and nothing new to apply."
            exit 0
          fi
          ./scripts/migrate.sh

  # 2. The email-reading Edge Function.
  functions:
    needs: migrate
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: fpgrghfzlpfxoshlamjo # shared Family Quiz project
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check and test
        working-directory: supabase/functions/gift-inbound
        run: deno check index.ts && deno test
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: latest
      - name: Deploy gift-inbound
        if: env.SUPABASE_ACCESS_TOKEN != ''
        # Resend signs each request, so Supabase's own JWT check is off.
        run: supabase functions deploy gift-inbound --remote="$PROJECT_REF" --no-verify-jwt --use-api --yes
      - name: Smoke test gift-inbound
        if: env.SUPABASE_ACCESS_TOKEN != ''
        # An unsigned request must be refused (401). 503 means the function's secrets are missing.
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -d '{}' "https://$PROJECT_REF.supabase.co/functions/v1/gift-inbound")
          echo "gift-inbound answered $code to an unsigned request"
          test "$code" = "401"

  # 3. The website.
  build:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build static site
        run: npm run build
        env:
          # /<repo name> on github.io, or empty with a custom domain.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Public values (row level security protects the data). Repo variables override them.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://fpgrghfzlpfxoshlamjo.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_NPOaC0P4Yx5KfJ2f7NHKtQ_oK317wRY' }}
          NEXT_PUBLIC_INBOUND_EMAIL_DOMAIN: ${{ vars.NEXT_PUBLIC_INBOUND_EMAIL_DOMAIN || 'turncloak.app' }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
