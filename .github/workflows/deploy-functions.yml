name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", ".github/workflows/deploy-functions.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: fpgrghfzlpfxoshlamjo # shared Family Quiz project
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check and test
        working-directory: supabase/functions/gift-inbound
        run: deno check index.ts && deno test
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: latest
      - name: Deploy gift-inbound
        if: env.SUPABASE_ACCESS_TOKEN != ''
        # Resend signs each request, so Supabase's own JWT check is off.
        run: supabase functions deploy gift-inbound --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
      - name: Explain skipped deploy
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "::warning::Add a SUPABASE_ACCESS_TOKEN repository secret to deploy Edge Functions automatically."
